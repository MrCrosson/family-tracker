<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosson Cheng Family Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5efe6;
    color: #3d3529;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 0.25rem;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #3C3B6E, #009246, #FC3D32);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: 1fr; max-width: 500px; }
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 1.5rem;
    padding-top: calc(1.5rem + 5px);
    border: 1px solid #e0d5c7;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--flag-1), var(--flag-2), var(--flag-3));
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 0 15px var(--glow);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .flag { font-size: 2rem; }
  .location-info h2 { font-size: 1.25rem; color: #1c1917; }
  .location-info .country { font-size: 0.85rem; color: var(--accent); font-weight: 500; }

  .section {
    background: #faf5ed;
    border-radius: 12px;
    padding: 1rem 1.25rem;
  }
  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }

  /* Time */
  .time-section { text-align: center; padding: 1.25rem; }
  .time {
    font-size: 2.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #1c1917;
    line-height: 1.1;
  }
  .date { font-size: 0.85rem; color: #78716c; margin-top: 0.25rem; }

  /* Weather */
  .weather-main {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .weather-icon { font-size: 2rem; }
  .weather-temp { font-size: 1.75rem; font-weight: 700; color: #1c1917; }
  .weather-desc { font-size: 0.85rem; color: #78716c; }
  .weather-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem;
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 1px solid #e8e0d4;
  }
  .detail {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: #78716c;
  }
  .detail-value { color: #3d3529; font-weight: 500; }

  /* Holidays */
  .holiday-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.35rem 0;
  }
  .holiday-item + .holiday-item { border-top: 1px solid #e8e0d4; }
  .holiday-name { font-size: 0.85rem; color: #3d3529; }
  .holiday-date { font-size: 0.75rem; color: #78716c; white-space: nowrap; margin-left: 0.5rem; }

  /* News */
  .news-item {
    display: block;
    padding: 0.4rem 0;
    text-decoration: none;
    color: #3d3529;
    font-size: 0.82rem;
    line-height: 1.35;
    transition: color 0.15s;
  }
  .news-item:hover { color: var(--accent); }
  .news-item + .news-item { border-top: 1px solid #e8e0d4; }
  .news-source {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 0.15rem;
  }

  /* Dog */
  .dog-section {
    max-width: 480px;
    margin: 2.5rem auto 0;
    text-align: center;
  }
  .dog-section .section-label {
    --accent: #78716c;
    margin-bottom: 1rem;
    font-size: 0.8rem;
  }
  .dog-frame {
    background: #ffffff;
    border-radius: 16px;
    padding: 0.75rem;
    border: 1px solid #e0d5c7;
    position: relative;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dog-frame img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 12px;
    display: block;
  }
  .dog-refresh {
    margin-top: 0.75rem;
    background: none;
    border: 1px solid #d6cdc0;
    color: #78716c;
    padding: 0.4rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .dog-refresh:hover { border-color: #3C3B6E; color: #3C3B6E; }

  /* Photo */
  .photo-section {
    border-radius: 12px;
    overflow: hidden;
    line-height: 0;
  }
  .photo-section img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: top center;
    border-radius: 12px;
  }

  .loading { color: #64748b; font-style: italic; font-size: 0.85rem; }
  .footer {
    text-align: center;
    color: #475569;
    font-size: 0.8rem;
    margin-top: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>Crosson Cheng Family Tracker</h1>
<p class="subtitle">Newton, MA &middot; Rome, Italy &middot; Mahajanga, Madagascar</p>
<div class="grid" id="cards"></div>

<div class="dog-section">
  <div class="section-label">Random Dog of the Hour</div>
  <div class="dog-frame" id="dog-frame">
    <span class="loading">Fetching a good boy...</span>
  </div>
  <button class="dog-refresh" onclick="fetchDog()">Another one</button>
</div>

<div class="footer">
  Weather updates every 15 min &middot; News updates every 30 min<br>
  <span id="updated"></span>
</div>

<script>
const locations = [
  {
    city: "Newton", country: "Massachusetts, USA", countryCode: "US",
    flag: "\u{1F1FA}\u{1F1F8}",
    tz: "America/New_York",
    lat: 42.337, lon: -71.209,
    photo: "photos/newton.jpg",
    photoPos: "center 40%",
    newsQuery: "Boston+local+news",
    accent: "#3C3B6E",
    glow: "rgba(60,59,110,0.15)",
    flagColors: ["#B22234","#FFFFFF","#3C3B6E"]
  },
  {
    city: "Rome", country: "Italy", countryCode: "IT",
    flag: "\u{1F1EE}\u{1F1F9}",
    tz: "Europe/Rome",
    lat: 41.90, lon: 12.50,
    photo: "photos/rome.jpg",
    photoPos: "center 75%",
    newsQuery: "Rome+Italy",
    accent: "#009246",
    glow: "rgba(0,146,70,0.15)",
    flagColors: ["#009246","#FFFFFF","#CE2B37"]
  },
  {
    city: "Mahajanga", country: "Madagascar", countryCode: "MG",
    flag: "\u{1F1F2}\u{1F1EC}",
    tz: "Indian/Antananarivo",
    lat: -15.72, lon: 46.32,
    photo: "photos/mahajanga.jpg",
    photoPos: "center 15%",
    newsQuery: "Madagascar+news",
    accent: "#FC3D32",
    glow: "rgba(252,61,50,0.15)",
    flagColors: ["#FC3D32","#FFFFFF","#007E3A"]
  }
];

const WMO_CODES = {
  0: ["Clear sky", "\u2600\uFE0F"],
  1: ["Mainly clear", "\u{1F324}\uFE0F"],
  2: ["Partly cloudy", "\u26C5"],
  3: ["Overcast", "\u2601\uFE0F"],
  45: ["Fog", "\u{1F32B}\uFE0F"], 48: ["Rime fog", "\u{1F32B}\uFE0F"],
  51: ["Light drizzle", "\u{1F326}\uFE0F"], 53: ["Drizzle", "\u{1F326}\uFE0F"], 55: ["Dense drizzle", "\u{1F326}\uFE0F"],
  61: ["Light rain", "\u{1F327}\uFE0F"], 63: ["Rain", "\u{1F327}\uFE0F"], 65: ["Heavy rain", "\u{1F327}\uFE0F"],
  71: ["Light snow", "\u{1F328}\uFE0F"], 73: ["Snow", "\u{1F328}\uFE0F"], 75: ["Heavy snow", "\u{1F328}\uFE0F"],
  77: ["Snow grains", "\u{1F328}\uFE0F"],
  80: ["Light showers", "\u{1F326}\uFE0F"], 81: ["Showers", "\u{1F327}\uFE0F"], 82: ["Heavy showers", "\u{1F327}\uFE0F"],
  85: ["Light snow showers", "\u{1F328}\uFE0F"], 86: ["Snow showers", "\u{1F328}\uFE0F"],
  95: ["Thunderstorm", "\u26C8\uFE0F"], 96: ["Thunderstorm + hail", "\u26C8\uFE0F"], 99: ["Thunderstorm + heavy hail", "\u26C8\uFE0F"]
};

// --- Build UI ---
function buildCards() {
  const grid = document.getElementById("cards");
  grid.innerHTML = "";
  locations.forEach((loc, i) => {
    grid.innerHTML += `
      <div class="card" id="card-${i}" style="--accent:${loc.accent};--glow:${loc.glow};--flag-1:${loc.flagColors[0]};--flag-2:${loc.flagColors[1]};--flag-3:${loc.flagColors[2]}">
        <div class="card-header">
          <span class="flag">${loc.flag}</span>
          <div class="location-info">
            <h2>${loc.city}</h2>
            <span class="country">${loc.country}</span>
          </div>
        </div>
        <div class="photo-section">
          <img src="${loc.photo}" alt="${loc.city}" style="object-position:${loc.photoPos}">
        </div>
        <div class="section time-section">
          <div class="time" id="time-${i}">--:--:--</div>
          <div class="date" id="date-${i}"></div>
        </div>
        <div class="section" id="weather-${i}">
          <div class="section-label">Weather</div>
          <span class="loading">Loading...</span>
        </div>
        <div class="section" id="holidays-${i}">
          <div class="section-label">Upcoming Holidays</div>
          <span class="loading">Loading...</span>
        </div>
        <div class="section" id="news-${i}">
          <div class="section-label">Local News</div>
          <span class="loading">Loading...</span>
        </div>
      </div>`;
  });
}

// --- Clocks ---
function updateClocks() {
  const now = new Date();
  locations.forEach((loc, i) => {
    const timeEl = document.getElementById(`time-${i}`);
    const dateEl = document.getElementById(`date-${i}`);
    if (!timeEl) return;
    timeEl.textContent = now.toLocaleTimeString("en-US", {
      timeZone: loc.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
    });
    dateEl.textContent = now.toLocaleDateString("en-US", {
      timeZone: loc.tz, weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
  });
}

// --- Weather ---
async function fetchWeather() {
  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const el = document.getElementById(`weather-${i}`);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(loc.tz)}`;
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current;
      const [desc, icon] = WMO_CODES[c.weather_code] || ["Unknown", "\u2753"];
      const tempC = Math.round((c.temperature_2m - 32) * 5 / 9);
      const feelsC = Math.round((c.apparent_temperature - 32) * 5 / 9);
      el.innerHTML = `
        <div class="section-label">Weather</div>
        <div class="weather-main">
          <span class="weather-icon">${icon}</span>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}\u00B0F <span style="font-size:0.55em;color:#78716c">${tempC}\u00B0C</span></div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div class="weather-details">
          <div class="detail">\u{1F321}\uFE0F Feels <span class="detail-value">${Math.round(c.apparent_temperature)}\u00B0F / ${feelsC}\u00B0C</span></div>
          <div class="detail">\u{1F4A7} Humidity <span class="detail-value">${c.relative_humidity_2m}%</span></div>
          <div class="detail">\u{1F32C}\uFE0F Wind <span class="detail-value">${Math.round(c.wind_speed_10m)} mph</span></div>
        </div>`;
    } catch {
      el.innerHTML = `<div class="section-label">Weather</div><span class="loading">Unavailable</span>`;
    }
  }
  document.getElementById("updated").textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
}

// --- Public Holidays (Nager.Date API) ---
async function fetchHolidays() {
  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const el = document.getElementById(`holidays-${i}`);
    try {
      const res = await fetch(`https://date.nager.at/api/v3/NextPublicHolidays/${loc.countryCode}`);
      const holidays = await res.json();
      const upcoming = holidays.slice(0, 3);
      if (upcoming.length === 0) throw new Error("none");
      el.innerHTML = `<div class="section-label">Upcoming Holidays</div>` +
        upcoming.map(h => {
          const d = new Date(h.date + "T00:00:00");
          const formatted = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
          const daysAway = Math.ceil((d - new Date(new Date().toDateString())) / 86400000);
          const badge = daysAway <= 7 ? ` <span style="color:#b45309;font-size:0.7rem">(in ${daysAway}d)</span>` : "";
          return `<div class="holiday-item">
            <span class="holiday-name">${h.localName}${badge}</span>
            <span class="holiday-date">${formatted}</span>
          </div>`;
        }).join("");
    } catch {
      el.innerHTML = `<div class="section-label">Upcoming Holidays</div><span class="loading">Unavailable</span>`;
    }
  }
}

// --- News (Google News RSS via CORS proxy) ---
async function fetchNews() {
  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const el = document.getElementById(`news-${i}`);
    try {
      const rssUrl = `https://news.google.com/rss/search?q=${loc.newsQuery}&hl=en-US&gl=US&ceid=US:en`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
      const res = await fetch(proxyUrl);
      const text = await res.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, "text/xml");
      const items = xml.querySelectorAll("item");
      const headlines = [];
      for (let j = 0; j < Math.min(4, items.length); j++) {
        const title = items[j].querySelector("title")?.textContent || "";
        const link = items[j].querySelector("link")?.textContent || "#";
        const source = items[j].querySelector("source")?.textContent || "";
        const cleanTitle = title.replace(/ - [^-]+$/, "").trim();
        headlines.push({ title: cleanTitle, link, source });
      }
      if (headlines.length === 0) throw new Error("none");
      el.innerHTML = `<div class="section-label">Local News</div>` +
        headlines.map(h => `
          <a class="news-item" href="${h.link}" target="_blank" rel="noopener">
            ${h.title}
            ${h.source ? `<div class="news-source">${h.source}</div>` : ""}
          </a>`).join("");
    } catch {
      el.innerHTML = `<div class="section-label">Local News</div>
        <a class="news-item" href="https://news.google.com/search?q=${loc.newsQuery}" target="_blank" rel="noopener">
          Open ${loc.city} news on Google News \u2192
        </a>`;
    }
  }
}

// --- Random Dog ---
async function fetchDog() {
  const frame = document.getElementById("dog-frame");
  frame.innerHTML = `<span class="loading">Fetching a good boy...</span>`;
  try {
    const res = await fetch("https://dog.ceo/api/breeds/image/random");
    const data = await res.json();
    if (data.status === "success") {
      const img = new Image();
      img.onload = () => { frame.innerHTML = ""; frame.appendChild(img); };
      img.onerror = () => { frame.innerHTML = `<span class="loading">Could not load image</span>`; };
      img.src = data.message;
      img.alt = "Random dog";
    } else {
      throw new Error();
    }
  } catch {
    frame.innerHTML = `<span class="loading">Could not fetch dog</span>`;
  }
}

// --- Init ---
buildCards();
updateClocks();
setInterval(updateClocks, 1000);

fetchWeather();
fetchHolidays();
fetchNews();
fetchDog();

setInterval(fetchWeather, 15 * 60 * 1000);
setInterval(fetchNews, 30 * 60 * 1000);
</script>
</body>
</html>
